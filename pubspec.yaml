name: DoctorBook
description: "A new Flutter project."
 
publish_to: 'none'  
 
version: 1.0.0+1

environment:
  sdk: '>=3.3.1 <4.0.0'
 
dependencies:
  flutter:
    sdk: flutter

 
  cupertino_icons: ^1.0.6
  #  Code generation for immutable classes that has a simple syntax/API without compromising on the features.
  # freezed: ^2.5.2
  # freezed_annotation: ^2.4.4
  # Simple direct Service Locator that allows to decouple the interface from a concrete implementation and to access the concrete implementation from everywhere in your App
  get_it: ^8.0.2
  # Automatically generate code for converting to and from JSON by annotating Dart classes.
  json_annotation: ^4.9.0
# NetWorking
  dio: ^5.7.0
  retrofit: ^4.4.1
  retrofit_generator: ^8.2.1
  pretty_dio_logger: ^1.4.0
  intl: ^0.19.0
  flutter_bloc: ^8.1.6
  # Customize Flutter's default white native splash screen with background color and splash image. Supports dark mode, full screen, and more.
  flutter_native_splash: ^2.4.0
  # An SVG rendering and widget library for Flutter, which allows painting and displaying Scalable Vector
  flutter_svg: ^2.0.10+1
  # A flutter plugin for adapting screen and font size.Guaranteed to look good on different models
  flutter_screenutil: ^5.9.3
  # Flutter plugin for reading and writing simple key-value pairs
  shared_preferences: ^2.2.3
  persistent_bottom_nav_bar: ^6.2.1
  shimmer: ^3.0.0
  easy_date_timeline: ^1.1.3

  

dev_dependencies:
  flutter_test:
    sdk: flutter
 
  flutter_lints: ^3.0.0
  json_serializable: ^6.8.0
  
flutter:
 
  uses-material-design: true
 
  assets:
    - assets/image/
    - assets/svg/
   
 
